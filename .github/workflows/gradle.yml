name: Build plugin jar

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    # Сборка вместе с тестами: если тест упал, jar не публикуется.
    - name: Build plugin
      run: ./gradlew build

    # Временный шаг: сверка API сервера, которым пользуется плагин.
    - name: Dump server API used by the plugin
      if: always()
      run: |
        set +e
        JAR=$(find "$HOME" -name "Server-*.jar" 2>/dev/null | head -1)
        echo "JAR: $JAR"
        for FQN in \
          com.hypixel.hytale.event.IEventRegistry \
          com.hypixel.hytale.server.core.event.events.player.PlayerChatEvent \
          'com.hypixel.hytale.server.core.event.events.player.PlayerChatEvent$Formatter' \
          com.hypixel.hytale.server.core.event.events.player.PlayerReadyEvent \
          com.hypixel.hytale.server.core.universe.PlayerRef \
          com.hypixel.hytale.server.core.Message \
          com.hypixel.hytale.server.core.command.system.AbstractCommand \
          com.hypixel.hytale.server.core.command.system.CommandContext \
          com.hypixel.hytale.server.core.command.system.arguments.system.RequiredArg \
          com.hypixel.hytale.server.core.plugin.PluginBase ; do
          echo "=========== $FQN"
          javap -cp "$JAR" "$FQN" 2>&1 | grep -v -E "^\s*(private|static \{\})" | head -120
        done
        echo "=========== ArgTypes.STRING"
        javap -cp "$JAR" com.hypixel.hytale.server.core.command.system.arguments.types.ArgTypes 2>&1 | grep -E " STRING;| GREEDY| class "
        exit 0

    - name: Show jar contents
      run: unzip -l build/libs/*.jar

    - name: Upload plugin jar as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChatTranslator-plugin
        path: build/libs/*.jar
        if-no-files-found: error

    # Кладём собранный jar в Releases, чтобы его можно было скачать одной ссылкой:
    # https://github.com/ayaft1445-eng/hytaleplug/releases/tag/chattranslator-latest
    - name: Publish jar to Releases
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        JARS=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | grep -v -- '-javadoc.jar')
        echo "Публикуем: $JARS"
        gh release delete chattranslator-latest --yes --cleanup-tag || true
        gh release create chattranslator-latest $JARS \
          --target "$GITHUB_SHA" \
          --title "ChatTranslator — последняя сборка" \
          --notes "Перевод чата Hytale между русским и английским через DeepL.

        Что делает: каждый игрок видит сообщения чата на своём языке. Язык определяется по языку игры при первом входе, сменить его можно командой /lang ru, /lang en, /lang auto или /lang off. Фразы, которые уже переводились, берутся из памяти, а не из DeepL.

        Как поставить: скачайте файл .jar ниже и положите его в ту же папку сервера, где лежат другие плагины (обычно mods/), затем перезапустите сервер и впишите ключ DeepL в config.json плагина.

        Инструкция целиком: INSTALL-RU.md в ветке claude/beautiful-cray-e4znih репозитория."
