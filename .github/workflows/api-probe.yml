name: API probe (temporary)

on:
  push:
    branches: [ "claude/beautiful-cray-e4znih" ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Resolve server jar
      run: ./gradlew compileJava

    - name: Probe command system
      run: |
        set +e
        JAR=$(find "$HOME" -name "Server-*.jar" 2>/dev/null | head -1)
        echo "JAR: $JAR"
        curl -sSL -o /tmp/cfr.jar https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar

        echo "===== commands that use the word lang/language"
        python3 - "$JAR" <<'EOF'
        import sys, zipfile
        jar = zipfile.ZipFile(sys.argv[1])
        for name in jar.namelist():
            if not name.endswith('.class') or '/command' not in name.lower():
                continue
            data = jar.read(name)
            for word in (b'lang', b'language', b'languages', b'translate', b'tr'):
                if b'\x01' + len(word).to_bytes(2, 'big') + word in data:
                    print(name, '->', word.decode())
        EOF

        echo "===== decompile"
        java -jar /tmp/cfr.jar "$JAR" --outputdir /tmp/src \
          --jarfilter '^com\.hypixel\.hytale\.server\.core\.command\.system\.(AbstractCommand|CommandManager|CommandRegistry|basecommands\.AbstractPlayerCommand|basecommands\.AbstractAsyncCommand)$' > /dev/null 2>&1
        find /tmp/src -name "*.java" | sort
        BASE=/tmp/src/com/hypixel/hytale/server/core/command/system

        echo "===== AbstractCommand: permission-related"
        grep -n -A14 -E "void requireNoPermission|void requirePermission\(String|public boolean hasPermission\(|protected String generatePermissionNode|public void completeRegistration" $BASE/AbstractCommand.java | head -150

        echo "===== AbstractCommand: acceptCall"
        grep -n -A70 "public CompletableFuture<Void> acceptCall" $BASE/AbstractCommand.java | head -110

        echo "===== AbstractPlayerCommand"
        sed -n '/^public abstract class/,$p' $BASE/basecommands/AbstractPlayerCommand.java | head -80

        echo "===== AbstractAsyncCommand"
        sed -n '/^public abstract class/,$p' $BASE/basecommands/AbstractAsyncCommand.java | head -80

        echo "===== CommandManager: executed command / register"
        grep -n -B3 -A40 "executed command" $BASE/CommandManager.java | head -120
        grep -n -A25 "public CommandRegistration register(" $BASE/CommandManager.java | head -60

        echo "===== CommandSender / PermissionHolder"
        javap -cp "$JAR" com.hypixel.hytale.server.core.command.system.CommandSender com.hypixel.hytale.server.core.permissions.PermissionHolder com.hypixel.hytale.server.core.receiver.IMessageReceiver 2>&1 | head -40
        exit 0
