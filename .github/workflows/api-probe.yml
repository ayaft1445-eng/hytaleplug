name: API probe (temporary)

on:
  push:
    branches: [ "claude/beautiful-cray-e4znih" ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Resolve server jar
      run: ./gradlew compileJava

    - name: Probe command system
      run: |
        set +e
        JAR=$(find "$HOME" -name "Server-*.jar" 2>/dev/null | head -1)
        echo "JAR: $JAR"
        curl -sSL -o /tmp/cfr.jar https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar

        echo "===== decompile"
        java -jar /tmp/cfr.jar "$JAR" --outputdir /tmp/src \
          --jarfilter '^com\.hypixel\.hytale\.server\.core\.(command\.system\.CommandManager|modules\.i18n\.commands\..*)$' > /dev/null 2>&1
        find /tmp/src -name "*.java" | sort

        echo "===== i18n commands: names, aliases, subcommands"
        for f in $(find /tmp/src/com/hypixel/hytale/server/core/modules/i18n -name "*.java"); do
          echo "--- $f"
          grep -n -E "class |super\(|addAliases|addSubCommand|addUsageVariant|withRequiredArg|withOptionalArg|requirePermission|setPermissionGroup" "$f" | head -40
        done

        echo "===== CommandManager: how a typed command is looked up"
        M=/tmp/src/com/hypixel/hytale/server/core/command/system/CommandManager.java
        grep -n -B2 -A12 -E "aliases\.get|commandRegistration\.get\(" "$M" | head -120

        echo "===== who registers i18n commands"
        grep -rn "InternationalizationCommands" /tmp/src | head
        javap -cp "$JAR" -p com.hypixel.hytale.server.core.modules.i18n.I18nModule | grep -i -E "command|setup" | head
        exit 0
