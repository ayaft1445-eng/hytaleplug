name: Build plugin jar

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build plugin
      run: ./gradlew build

    - name: Show jar contents
      run: unzip -l build/libs/*.jar

    - name: Upload plugin jar as artifact
      uses: actions/upload-artifact@v4
      with:
        name: SimpleMenu-plugin
        path: build/libs/*.jar
        if-no-files-found: error

    # Кладём собранный jar в Releases, чтобы его можно было скачать одной ссылкой:
    # https://github.com/ayaft1445-eng/hytaleplug/releases/latest
    - name: Publish jar to Releases
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        JARS=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | grep -v -- '-javadoc.jar')
        echo "Публикуем: $JARS"
        gh release delete simplemenu-latest --yes --cleanup-tag || true
        gh release create simplemenu-latest $JARS \
          --target "$GITHUB_SHA" \
          --title "SimpleMenu — последняя сборка" \
          --notes "Плагин меню для сервера Hytale.

        Что делает: команда /menu открывает меню с двумя вкладками, в правом нижнем углу экрана висит плашка-подсказка.

        Как поставить: скачайте файл SimpleMenu-1.0.0.jar ниже и положите его в папку plugins/ вашего сервера, затем перезапустите сервер.

        Инструкция целиком: INSTALL-RU.md в репозитории."

    - name: Dump Hytale API signatures
      if: always()
      run: |
        set +e
        JAR=$(find "$HOME" -name "*.jar" 2>/dev/null | grep -iv wrapper | xargs -I{} sh -c 'unzip -l {} 2>/dev/null | grep -q "server/core/event/events/player/" && echo {}' | head -1)
        echo "JAR: $JAR"
        echo "===== события игрока ====="
        unzip -l "$JAR" | awk '{print $4}' | grep -E "event/events/player/[A-Za-z]+Event\\.class$" | sed 's#.*/##'
        echo "===== всё, что похоже на ввод ====="
        unzip -l "$JAR" | awk '{print $4}' | grep -E "\\.class$" | grep -iE "(input|keybind|hotkey|mouse|emote|useitem|iteminteract)" | sed 's#^#  #' | head -40
        echo "===== события блоков и сущностей ====="
        unzip -l "$JAR" | awk '{print $4}' | grep -E "event/events/(block|entity|world)/[A-Za-z]+Event\\.class$" | sed 's#.*/##' | head -40
        exit 0
