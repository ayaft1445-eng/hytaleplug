name: Build plugin jar

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    # Сборка вместе с тестами: если тест упал, jar не публикуется.
    - name: Build plugin
      run: ./gradlew build

    - name: Show jar contents
      run: unzip -l build/libs/*.jar

    - name: Upload plugin jar as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChatTranslator-plugin
        path: build/libs/*.jar
        if-no-files-found: error

    # Кладём собранный jar в Releases, чтобы его можно было скачать одной ссылкой:
    # https://github.com/ayaft1445-eng/hytaleplug/releases/tag/chattranslator-latest
    - name: Publish jar to Releases
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        JARS=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | grep -v -- '-javadoc.jar')
        echo "Публикуем: $JARS"
        gh release delete chattranslator-latest --yes --cleanup-tag || true
        gh release create chattranslator-latest $JARS \
          --target "$GITHUB_SHA" \
          --title "ChatTranslator — последняя сборка" \
          --notes "Перевод чата Hytale между русским и английским.

        Что делает: каждый игрок видит сообщения чата на своём языке. Язык определяется по языку игры при первом входе, сменить его можно в любой момент командой /tr ru, /tr en, /tr auto или /tr off (/lang занята встроенной командой сервера).

        Как переводит: частые фразы чата — встроенным разговорником и файлом phrases.txt сервера, отдельные слова — словарём, уже переводившиеся фразы — из памяти, остальное — DeepL (если вписан ключ) или бесплатным MyMemory. Проверить, откуда перевод: /tr test текст.

        Как поставить: скачайте файл .jar ниже и положите его в папку mods/ сервера, удалив старый ChatTranslator-*.jar, затем перезапустите сервер.

        Словарь собран из данных OpenRussian.org (CC BY-SA 4.0).

        Инструкция целиком: INSTALL-RU.md в ветке claude/beautiful-cray-e4znih репозитория."
