name: API probe (temporary)

on:
  push:
    branches: [ "claude/beautiful-cray-e4znih" ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Resolve server jar
      run: ./gradlew compileJava || true

    - name: Probe command system
      run: |
        set +e
        JAR=$(find "$HOME" -name "Server-*.jar" 2>/dev/null | head -1)
        echo "JAR: $JAR"
        echo "===== CommandManager public API"
        javap -cp "$JAR" com.hypixel.hytale.server.core.command.system.CommandManager | grep -E "static|resolveCommand|public .*get" | head -20
        exit 0
